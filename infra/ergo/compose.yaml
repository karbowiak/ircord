name: ircord-ergo-tests
services:
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1@sha256:ef885e44f7fa19101bbbc41baef11dc280dc8107465dccaf6f0860f41b48a682
    ports:
      - "127.0.0.1:16667:6667"
      - "127.0.0.1:16697:6697"
    volumes:
      - ../../.data/ergo:/ircd
    init: true
    restart: "no"
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6667"]
      interval: 2s
      timeout: 1s
      retries: 20
