name: Build and publish containers
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 1'

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: stable
          cache: false

  publish:
    needs: toolchain
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: GO_VERSION=${{ needs.toolchain.outputs.go-version }}
          tags: |
            ghcr.io/karbowiak/ircord-${{ matrix.component }}:main-${{ github.run_number }}
            ghcr.io/karbowiak/ircord-${{ matrix.component }}:main
            ghcr.io/karbowiak/ircord-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/karbowiak/ircord
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
