name: Build and publish containers
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests, contracts, vet, lint and types must pass before either image is published.
  check:
    if: github.event.deleted == false
    uses: ./.github/workflows/check.yaml

  toolchain:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: stable
          cache: false

  # Release notes for the in-client changelog, baked into the frontend image: CHANGELOG.md's
  # section for each release, or its GitHub Release notes for releases without one. The CLI workflow
  # may not have created this tag's GitHub Release yet; a tag without a section then asks GitHub's
  # generator for the same notes. Write access is needed only for that generator call; nothing is
  # created.
  changelog:
    if: github.event.deleted == false && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun frontend/scripts/release-changelog.mjs .data/changelog/changelog.json CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: .data/changelog/changelog.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [check, toolchain, changelog]
    # The backend does not use the notes: it publishes even if the changelog job failed. The
    # frontend leg then fails at the download below, since its notes cannot be added later.
    # Nothing publishes unless the checks passed.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.toolchain.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.component == 'frontend'
        with:
          name: changelog
          path: frontend/server/assets
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            GO_VERSION=${{ needs.toolchain.outputs.go-version }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/karbowiak/ircord-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/karbowiak/ircord-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/karbowiak/ircord
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
