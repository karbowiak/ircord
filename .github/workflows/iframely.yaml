name: Track Iframely releases
on:
  schedule:
    # Saturdays, 07:17 UTC. Independent of IRCord application releases.
    - cron: '17 7 * * 6'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional stable upstream release tag; blank checks the latest release'
        type: string
        default: ''
      force_rebuild:
        description: 'Rebuild an existing version after packaging/configuration changes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iframely-upstream-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ircord-iframely
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the release updater
        run: python3 -m unittest discover -s infra/iframely -p 'test_*.py'
      - name: Resolve the latest stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python3 infra/iframely/upstream-release.py resolve --tag "$UPSTREAM_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip a release whose image already exists
        id: existing
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE_REBUILD" != "true" ]] && docker buildx imagetools inspect "$IMAGE:upstream-$VERSION" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Iframely $VERSION is already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify upstream source identity and checksum
        if: steps.existing.outputs.build == 'true'
        id: source
        env:
          UPSTREAM_COMMIT: ${{ steps.release.outputs.upstream_commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 infra/iframely/upstream-release.py source --commit "$UPSTREAM_COMMIT" --version "$VERSION" --output "$RUNNER_TEMP/iframely-source.tar.gz"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.build == 'true'
        id: build
        with:
          context: infra/iframely
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            IFRAMELY_REV=${{ steps.release.outputs.upstream_commit }}
            IFRAMELY_SOURCE_SHA256=${{ steps.source.outputs.source_sha256 }}
          tags: |
            ${{ env.IMAGE }}:source-${{ steps.release.outputs.upstream_commit }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.ircord.iframely.upstream=https://github.com/itteco/iframely
            io.ircord.iframely.upstream-commit=${{ steps.release.outputs.upstream_commit }}
          cache-from: type=gha,scope=iframely
          cache-to: type=gha,mode=max,scope=iframely
      - name: Check the built image before promoting it
        if: steps.existing.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node -e EXPECTED_VERSION="$VERSION" "$IMAGE@$DIGEST" -e 'if(require("./package.json").version !== process.env.EXPECTED_VERSION) process.exit(1)'
          docker run --detach --name iframely-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,size=32m --publish 127.0.0.1:8061:8061 "$IMAGE@$DIGEST"
          trap 'docker logs iframely-smoke; docker rm --force iframely-smoke' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --output /dev/null http://127.0.0.1:8061/; then break; fi
            if [[ "$attempt" == "30" ]]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error --get --data-urlencode 'url=https://example.com' http://127.0.0.1:8061/iframely > "$RUNNER_TEMP/iframely-smoke.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("meta", {}).get("title") and not d.get("error")' "$RUNNER_TEMP/iframely-smoke.json"
      - name: Promote the tested image for Flux
        if: steps.existing.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:upstream-$VERSION" "$IMAGE@$DIGEST"
          printf 'Published %s:upstream-%s after startup and metadata checks. Flux follows stable upstream versions and image digests.\n' "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
