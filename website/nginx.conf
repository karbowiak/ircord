# Serves the generated website. TLS and the public address are the ingress's job.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;
    error_page 404 /404.html;

    # Static pages only: no scripts run, no requests go to other sites and no page can be framed.
    # Speculation rules are declarative prefetch hints, not executed scripts.
    set $csp "default-src 'none'; script-src 'inline-speculation-rules'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # add_header in a location replaces the server's headers, so every location includes the
    # shared security headers (security-headers.conf) and then sets its own cache policy.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Build output with a content hash in its name never changes.
    location /_nuxt/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Serve /changelog without redirecting to /changelog/.
    location = /changelog/ {
        include /etc/nginx/security-headers.conf;
        return 301 /changelog;
    }
}
